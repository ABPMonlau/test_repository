<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Vino</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='vinos.css') }}?v=2">
</head>

<body>
    <h1>Nuevo Vino</h1>

    <div class="form-container">
        <form action="/vinos/nuevo" method="POST">

            <label>Nombre del Vino *</label>
            <input type="text" name="vino_nombre" required maxlength="150">

            <label>Tipo de Vino</label>
            <select name="vino_tipo">
                <option value="">-- Selecciona un tipo --</option>
                {% for tipo in tipos %}
                <option value="{{ tipo.tipo_id }}">{{ tipo.tipo_nombre }}</option>
                {% endfor %}
            </select>

            <label>Bodega</label>
            <select name="bodega">
                <option value="">-- Selecciona la bodega --</option>
                {% for bodega in bodegas %}
                <option value="{{ bodega.bodega_id }}">{{ bodega.bodega_nombre }}</option>
                {% endfor %}
            </select>

            <label>Zona de Origen (Escribe o selecciona)</label>
            <input type="text" name="zona_origen" maxlength="100" list="sugerencias_zonas" autocomplete="off"
                placeholder="Ej. Rioja, Ribera del Duero...">
            <datalist id="sugerencias_zonas">
                {% for zona in zonas_existentes %}
                <option value="{{ zona.zona_origen }}"></option>
                {% endfor %}
            </datalist>

            <label>Descripción / Notas de cata</label>
            <textarea name="vino_desc" rows="3"></textarea>

            <div style="margin-top: 30px; text-align: center;">
                <a href="/vinos" class="btn">Cancelar</a>
                <button type="submit" class="btn" style="margin-left: 15px;">Guardar Vino</button>
            </div>

        </form>
    </div>
</body>

</html>
